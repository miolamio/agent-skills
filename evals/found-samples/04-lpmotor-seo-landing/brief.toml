[meta]
schema_version = "1.0"
genre = "seo-landing"
intensity = "light"
mode = "line_edit"
expected_mode = "line_edit"
source_url = "https://lpmotor.ru/articles/besplatnye-ii-servisy-2025-2510"

[expected_findings]
# Phase 2D baseline: source hard=0 warn=1, edited hard=0 warn=0.
# Note: «более 70% пользователей» — fake stat, but adjacent to «ИИ-сервисов»
# (no citation marker), so unsourced_percentage may fire as a future check tightening.

hard_fail_min = 0
hard_fail_max = 2
warn_min = 1
warn_max = 5

checks_must_fire = ["no_warn_markers"]

checks_must_not_fire_on_edited = ["no_warn_markers", "no_banned_markers"]

expected_clean_on_lint = true
