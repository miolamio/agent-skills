[meta]
schema_version = "1.0"
genre = "blog"
intensity = "medium"
mode = "line_edit"
expected_mode = "line_edit"

[expected_findings]
# Edge case: Mixed scripts (RU/EN), multi-byte emoji, ZWJ sequences, narrow NBSP, combining diacritics. Tests linter robustness on Unicode.
# Linter on source.md: hard_fail=15, warn=3.
# Linter on expected.md: hard_fail=0, warn=1.

hard_fail_min = 13
hard_fail_max = 17
warn_min = 1
warn_max = 5

# HARD_FAIL checks that fired on source.md (must be eliminated in expected.md):
checks_must_fire = ["no_arrows_in_prose", "no_banned_markers", "no_double_hyphen", "no_emoji", "no_straight_quotes"]

# These must NOT fire on expected.md (acceptance gate ensures hard_fail=0):
checks_must_not_fire_on_expected = ["no_arrows_in_prose", "no_banned_markers", "no_double_hyphen", "no_emoji", "no_straight_quotes"]

# Idempotency: lint(expected.md) must produce 0 HARD_FAIL.
expected_clean_on_lint = true
