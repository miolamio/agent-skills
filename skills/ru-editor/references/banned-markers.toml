[synonym_clusters]
# Detected during AI-output drift: model cycles synonyms within one document.
# 3+ members from same cluster within 500 chars → WARN.
product_drift     = ["продукт", "решение", "инструмент", "платформа"]
user_drift        = ["пользователь", "клиент", "человек", "специалист"]
journey_metaphor  = ["путешествие в мир", "наше путешествие", "это путешествие", "journey"]
revolution_hype   = ["революция", "революционный", "революционная", "переворот", "прорыв", "breakthrough"]
intensifier_drift = ["полностью", "абсолютно", "совершенно", "принципиально", "кардинально", "максимально"]
emphasis_drift    = ["невероятно", "крайне", "исключительно", "беспрецедентно"]
